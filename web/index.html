<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="本地求职资料、申请记录与公司资源管理"><title>求职档案 · Career</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"><script src="/forms.js" defer></script><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark">C</span><span>Career<small>我的求职档案</small></span></a><nav aria-label="主要导航"><button data-page="overview" class="active">概览</button><button data-page="profile">个人资料</button><button data-page="intention">求职意向</button><button data-page="resumes">简历方案</button><button data-page="recommendations">推荐岗位</button><button data-page="applications">投递情况</button><button data-page="mailbox">邮箱通知</button><button data-page="documents">简历材料</button><button data-page="forms">自动填表</button><button data-page="tasks">任务</button><button data-page="resources">公司资源</button><button data-page="settings">设置与跟进</button></nav><div class="sidebar-bottom"><span class="local-dot"></span> 资料保存在本机数据库<p>自动填写已支持字段<br>由你决定最终投递</p></div></aside>
<main><header class="topbar"><div><span class="eyebrow">CAREER WORKSPACE</span><h1 id="page-title">概览</h1></div><div class="header-actions"><div class="account-controls"><label for="account-select">本地账号</label><select id="account-select" disabled aria-label="切换本地用户账号"><option>正在读取…</option></select><button id="account-new" class="button secondary small" disabled>新建账号</button></div><span id="save-state" role="status"></span><button id="refresh" class="button secondary">刷新</button></div></header><div id="notice" role="alert" hidden></div><div id="content" aria-live="polite"><div class="empty">正在读取本机资料…</div></div><footer>网页与 Agent 共用本机数据库。每个本地账号有独立资料、偏好和任务；账号切换不代表招聘网站登录。</footer></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-heading"><h2 id="editor-title">编辑资料</h2><button type="button" data-close class="icon-button" aria-label="关闭">×</button></div><div id="editor-fields"></div><div class="form-actions"><button type="button" data-close class="button secondary">取消</button><button type="submit" class="button">保存修改</button></div></form></dialog>
<dialog id="detail"><div class="dialog-heading"><h2 id="detail-title">详情</h2><button data-close class="icon-button" aria-label="关闭">×</button></div><div id="detail-content"></div><div id="detail-actions" class="form-actions"></div></dialog>
<dialog id="account-editor"><form id="account-form"><div class="dialog-heading"><h2>新建本地账号</h2><button type="button" data-close class="icon-button" aria-label="关闭">×</button></div><p class="help">用于在本机管理不同用户的求职档案。这是本地资料分区，不是网络登录或访问权限认证。</p><label>账号名称<input name="name" required maxlength="80" autocomplete="off" placeholder="例如：张同学"></label><div class="form-actions"><button type="button" data-close class="button secondary">取消</button><button type="submit" class="button">创建并切换</button></div></form></dialog>
<dialog id="task-editor"><form id="task-form"><div class="dialog-heading"><h2 id="task-editor-title">编辑 Agent 任务</h2><button type="button" data-close class="icon-button" aria-label="关闭">×</button></div><div id="task-editor-fields"></div><p class="help">保存的是任务要求。Agent 每次执行前读取当前账号、最新偏好和资料，再写回任务进度。</p><div class="form-actions"><button type="button" data-close class="button secondary">取消</button><button type="submit" class="button">保存任务</button></div></form></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
